<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COINOVA | Innovación & Monedas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>COINOVA</h1>
    <hr>
  </header>

  <main class="container">
    <aside>
      <button type="button" id="maquinasBtn">Taller</button>
      <!--<button type="button" id="reportesBtn">Reportes</button>-->
      <button type="button" id="inventarioBtn">Inventario</button>
      <!--<button type="button" id="clientesBtn">Clientes</button>-->
      <button type="button" id="volverBtn">Volver al menu</button>
    </aside>

    <section>
      <div class="dash">
        <div class="card">
          <h2>Total Máquinas</h2>
          <p id="ID-Maquinas">--</p>
        </div>
        <div class="card">
          <h2>Maquinas Dañadas</h2>
          <p id="Estado-MaquinasD">--</p>
        </div>
        <div class="card">
          <h2>Maquinas Funcionando</h2>
          <p id="Estado-MaquinasF">--</p>
        </div>
        <div class="card">
          <h2>Cantidad de Repuestos</h2>
          <p id="ID-Repuestos">--</p>
        </div>
      </div>
      <div>
        <div class="Card_Reportes">
          <table id="table_Reportes" class="table_Reportes">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Tecnico</th>
                <th>Asunto</th>
                <th><button type="button" id="abrir_modal_reporte" class="btn_reporte">abrir</button></th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla">
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>


  <!--Modal para los reportes-->

  <div id="Modal_Reporte" class="Modal">
    <div class="Modal_Contenido_Reporte">
      <h2>Detalle del Reporte</h2>

      <p><strong>Cliente:</strong> <span id="modal-cliente"></span></p>
      <p><strong>Técnico:</strong> <span id="modal-tecnico"></span></p>
      <p><strong>Asunto:</strong> <span id="modal-asunto"></span></p>
      <p><strong>Descripción completa:</strong></p>
      <p id="modal-descripcion"></p>

      <button type="button" id="cerrar_modal_reporte">cerrar</button>
    </div>
  </div>

  <script src="../Negocio/app.js"></script>
  <script src="../Negocio/botones_menu.js"></script>
  <script src="../Negocio/Modals.js"></script>
</body>

</html>
